name: Rank AP7d scan

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 */3 * *"   # каждые 3 дня в 04:00 UTC = 05:00 по Варшаве зимой, 06:00 летом

concurrency:
  group: rank-ap7d
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GOOGLE_CREDS: ${{ secrets.GOOGLE_CREDS }}
      HEADLESS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run scan
        run: python RankAP7d.py
